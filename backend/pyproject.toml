[project]
name = "sentinelguard-backend"
version = "0.1.0"
description = "SentinelGuard - Agentic AI Security Gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "litellm>=1.50",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "detect-secrets>=1.5",
  "presidio-analyzer>=2.2.354",
  "presidio-anonymizer>=2.2.354",
  "spacy>=3.7",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "pgvector>=0.3",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "tenacity>=9.0",
  # File-upload extraction (text/code already work via stdlib; these enable
  # PDF, DOCX, and image OCR — pytesseract additionally needs the system
  # `tesseract` binary for OCR to actually run, otherwise it falls back
  # gracefully to "no OCR text available").
  "pypdf>=4.2",
  "python-docx>=1.1",
  "Pillow>=10.0",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "httpx>=0.27",
  "aiosqlite>=0.19",
]
observability = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
